<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Web Profesional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">MiPortafolio</div>
        <button id="btn-tema" class="btn-secundario">🌙 Modo Oscuro</button>
    </header>
    <main>
        <section class="hero">
            <h1>¡Hola, bienvenido a mi primera web!</h1>
            <p>Este sitio web ha sido creado con HTML semántico, CSS moderno y JavaScript, desplegado en la nube.</p>
            <button id="btn-saludo" class="btn-principal">¡Salúdame!</button>
            <p id="mensaje" class="mensaje-oculto"></p>
        </section>
        <section class="contador-seccion">
            <h2>Contador Interactivo</h2>
            <p>Haz clic en el botón para aumentar el contador:</p>
            <div class="contador-box">
                <span id="contador">0</span>
                <button id="btn-incrementar" class="btn-principal">+</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Creado con pasión.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
